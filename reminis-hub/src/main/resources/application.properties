spring.application.name=reminis-hub

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JWT propio: secreto externo de al menos 32 bytes UTF-8 y vigencia en minutos.
reminishub.jwt.secret=${RH_JWT_SECRET:}
reminishub.jwt.minutos=${RH_JWT_MINUTOS:60}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.flyway.clean-disabled=true