spring.security.oauth2.client.registration.google.client-id=${RH_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${RH_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=https://localhost:8443/login/oauth2/code/google
reminishub.google.habilitado=true
