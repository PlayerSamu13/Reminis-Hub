<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"><body>
<div th:fragment="resultados" id="resultados" tabindex="-1">
    <div class="results-meta"><p class="result-count" th:text="#{catalog.count(${resultado.total})}">0 proyectos encontrados</p><span th:text="#{catalog.order}">Periodo más reciente</span></div>
    <div th:if="${resultado.contenido.isEmpty()}" class="empty-state">
        <span class="empty-mark" aria-hidden="true">{ }</span>
        <h3 th:text="#{empty.title}">Aún no hay coincidencias</h3>
        <p th:text="#{empty.description}">Prueba con otra palabra o elimina algún filtro para seguir explorando.</p>
        <a class="btn btn-outline-primary" th:href="@{/proyectos}" th:text="#{empty.reset}">Ver todos los proyectos</a>
    </div>
    <div class="project-grid" th:unless="${resultado.contenido.isEmpty()}">
        <article class="project-card" th:each="p : ${resultado.contenido}">
            <div class="card-top"><span class="category-tag" th:text="${#messages.msgOrNull('categoria.' + p.categoria) ?: p.categoria}"></span><span class="period" th:text="${p.periodo()}"></span></div>
            <p class="fiction-label" th:if="${p.ficticio}" th:text="#{project.fictitious}">Datos ficticios</p>
            <h3><a th:href="@{/proyectos/{id}(id=${p.id})}" th:text="${p.nombre}"></a></h3>
            <p class="project-summary" th:text="${p.resumen}"></p>
            <ul class="tech-list" th:attr="aria-label=#{project.technologies}"><li th:each="t : ${p.tecnologias}" th:text="${t}"></li></ul>
            <div class="card-bottom"><span class="published"><span aria-hidden="true">✓</span> <span th:text="#{project.published}">Publicado</span></span><a th:href="@{/proyectos/{id}(id=${p.id})}" th:attr="aria-label=#{project.viewNamed(${p.nombre})}"><span th:text="#{project.view}">Ver proyecto</span> <span aria-hidden="true">↗</span></a></div>
        </article>
    </div>
    <nav class="pagination-bar" th:if="${resultado.paginas > 1}" th:attr="aria-label=#{pagination.label}">
        <a class="btn btn-outline-secondary" th:if="${resultado.pagina > 0}" th:href="@{/proyectos(q=${q},categoria=${categoria},anio=${anio},tecnologia=${tecnologia},pagina=${resultado.pagina - 1})}"><span aria-hidden="true">← </span><span th:text="#{pagination.previous}">Anterior</span></a>
        <span th:unless="${resultado.pagina > 0}"></span>
        <span th:text="#{pagination.current(${resultado.pagina + 1},${resultado.paginas})}"></span>
        <a class="btn btn-outline-secondary" th:if="${resultado.pagina + 1 < resultado.paginas}" th:href="@{/proyectos(q=${q},categoria=${categoria},anio=${anio},tecnologia=${tecnologia},pagina=${resultado.pagina + 1})}"><span th:text="#{pagination.next}">Siguiente</span><span aria-hidden="true"> →</span></a>
        <span th:unless="${resultado.pagina + 1 < resultado.paginas}"></span>
    </nav>
</div>
</body></html>
